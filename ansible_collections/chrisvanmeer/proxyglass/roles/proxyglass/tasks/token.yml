---
- name: Check whether generated token marker already exists
  ansible.builtin.stat:
    path: "{{ proxyglass_token_file }}"
  register: proxyglass_token_stat
  become: true

- name: Check whether tokens.json already contains tokens
  ansible.builtin.shell: |
    set -euo pipefail
    if [ ! -f "{{ proxyglass_tokens_path }}" ]; then exit 1; fi
    python3 -c "import json,sys; d=json.load(open('{{ proxyglass_tokens_path }}')); sys.exit(0 if d.get('tokens') else 1)"
  register: proxyglass_tokens_check
  changed_when: false
  failed_when: false
  become: true

- name: Generate token only when no token marker and no existing tokens
  when:
    - not proxyglass_token_stat.stat.exists
    - proxyglass_tokens_check.rc | default(1) != 0
  block:
    - name: Generate Proxyglass administrative token
      ansible.builtin.command:
        argv:
          - "{{ proxyglass_install_path }}"
          - --generate-token
          - --quiet
          - --config
          - "{{ proxyglass_config_path }}"
      register: proxyglass_generated_token
      changed_when: true
      no_log: true
      become: true

    - name: Store generated token in protected marker file
      ansible.builtin.copy:
        content: "{{ proxyglass_generated_token.stdout }}\n"
        dest: "{{ proxyglass_token_file }}"
        owner: root
        group: root
        mode: '0600'
      no_log: true
      become: true

- name: Ensure token file remains private
  ansible.builtin.file:
    path: "{{ proxyglass_token_file }}"
    owner: root
    group: root
    mode: '0600'
    state: file
  become: true
  when: proxyglass_token_stat.stat.exists
