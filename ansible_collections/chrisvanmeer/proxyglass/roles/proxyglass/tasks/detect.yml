---
- name: Assert supported architecture
  ansible.builtin.assert:
    that:
      - proxyglass_arch | length > 0
    fail_msg: >-
      Unsupported architecture: {{ ansible_facts.architecture }}.
      Supported: x86_64/amd64, aarch64/arm64.
    quiet: true

- name: Gather service facts
  ansible.builtin.service_facts:
  when: ansible_facts.services is not defined

- name: Check if proxyglass service exists
  ansible.builtin.set_fact:
    proxyglass_service_exists: "{{ ansible_facts.services[proxyglass_service_name + '.service'] is defined }}"

- name: Check if proxyglass service is running
  ansible.builtin.set_fact:
    proxyglass_service_running: >-
      {{ proxyglass_service_exists and
         ansible_facts.services[proxyglass_service_name + '.service'].state == 'running' }}
