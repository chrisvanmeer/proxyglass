---
- name: Detect environment
  ansible.builtin.include_tasks: detect.yml
  tags: ["proxyglass", "detect"]

- name: Resolve and verify GitHub release version (before stopping service)
  ansible.builtin.include_tasks: check_version.yml
  tags: ["proxyglass", "version"]

- name: Check temp mount for noexec
  ansible.builtin.include_tasks: check_mount.yml
  tags: ["proxyglass", "mount"]

- name: Download binary
  ansible.builtin.include_tasks: download.yml
  tags: ["proxyglass", "download"]

- name: Determine whether installation requires a service restart
  ansible.builtin.include_tasks: check_install.yml
  tags: ["proxyglass", "install", "service"]

- name: Deploy Proxyglass and restore service in all cases
  ansible.builtin.include_tasks: deploy.yml
  tags: ["proxyglass", "install", "service"]

- name: Ensure token exists
  ansible.builtin.include_tasks: token.yml
  when: proxyglass_generate_token_if_missing | bool
  tags: ["proxyglass", "token"]
