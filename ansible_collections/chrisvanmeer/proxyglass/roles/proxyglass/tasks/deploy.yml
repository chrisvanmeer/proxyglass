---
- name: Deploy Proxyglass and restore its systemd service
  block:
    - name: Stop existing Proxyglass service
      ansible.builtin.systemd:
        name: "{{ proxyglass_service_name }}"
        state: stopped
      become: true
      when:
        - proxyglass_manage_service | bool
        - proxyglass_service_exists | bool
        - proxyglass_service_running | bool
        - proxyglass_deploy_required | bool

    - name: Ensure Proxyglass service group exists
      ansible.builtin.group:
        name: "{{ proxyglass_service_group }}"
        system: true
        state: present
      become: true

    - name: Ensure Proxyglass service account exists
      ansible.builtin.user:
        name: "{{ proxyglass_service_user }}"
        group: "{{ proxyglass_service_group }}"
        system: true
        create_home: false
        shell: /usr/sbin/nologin
        state: present
      become: true

    - name: Ensure Proxyglass data directory exists
      ansible.builtin.file:
        path: "{{ proxyglass_data_dir }}"
        state: directory
        owner: "{{ proxyglass_service_user }}"
        group: "{{ proxyglass_service_group }}"
        mode: '0750'
      become: true

    - name: Ensure Proxyglass log directory exists
      ansible.builtin.file:
        path: "{{ proxyglass_log_dir }}"
        state: directory
        owner: "{{ proxyglass_service_user }}"
        group: "{{ proxyglass_service_group }}"
        mode: '0750'
      become: true

    - name: Install Proxyglass logrotate configuration
      ansible.builtin.template:
        src: logrotate.j2
        dest: "{{ proxyglass_logrotate_path }}"
        owner: root
        group: root
        mode: '0644'
      become: true

    - name: Ensure Proxyglass installation directory exists
      ansible.builtin.file:
        path: "{{ proxyglass_install_path | dirname }}"
        state: directory
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Install Proxyglass binary
      ansible.builtin.copy:
        src: "{{ proxyglass_download_dest }}"
        dest: "{{ proxyglass_install_path }}"
        remote_src: true
        owner: root
        group: root
        mode: '0755'
      become: true

    - name: Ensure default config exists
      ansible.builtin.include_tasks: config.yml

    - name: Install Proxyglass systemd unit
      ansible.builtin.template:
        src: proxyglass.service.j2
        dest: "/etc/systemd/system/{{ proxyglass_service_name }}.service"
        owner: root
        group: root
        mode: '0644'
      become: true
      when: proxyglass_manage_service | bool
  always:
    - name: Reload systemd manager configuration
      ansible.builtin.systemd:
        daemon_reload: true
      become: true
      when: proxyglass_manage_service | bool

    - name: Check whether Proxyglass unit is installed
      ansible.builtin.stat:
        path: "/etc/systemd/system/{{ proxyglass_service_name }}.service"
      register: proxyglass_unit_stat
      when: proxyglass_manage_service | bool

    - name: Enable and start Proxyglass service
      ansible.builtin.systemd:
        name: "{{ proxyglass_service_name }}"
        enabled: "{{ proxyglass_service_enabled }}"
        state: started
      become: true
      when:
        - proxyglass_manage_service | bool
        - proxyglass_unit_stat.stat.exists | default(false) or proxyglass_service_exists | bool
