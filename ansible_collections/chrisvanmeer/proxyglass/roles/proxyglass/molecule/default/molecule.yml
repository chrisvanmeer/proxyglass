---
driver:
  name: docker

platforms:
  - name: proxyglass-ubuntu2204
    image: geerlingguy/docker-ubuntu2204-ansible:latest
    pre_build_image: true
    privileged: true
    cgroupns_mode: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
    command: /lib/systemd/systemd
    tmpfs:
      - /run
      - /tmp

provisioner:
  name: ansible
  playbooks:
    converge: converge.yml
    prepare: prepare.yml
    verify: verify.yml
  inventory:
    host_vars:
      proxyglass-ubuntu2204:
        proxyglass_version: latest
        proxyglass_temp_dir: /var/tmp/proxyglass
        proxyglass_force_noexec_check: true
        proxyglass_generate_token_if_missing: true
        proxyglass_default_refresh: ""
  env:
    ANSIBLE_REMOTE_TEMP: /tmp/ansible-remote
    HOME: /tmp

verifier:
  name: ansible

scenario:
  test_sequence:
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - verify
    - destroy

lint: |
  set -e
  yamllint .
  ansible-lint
