---
- name: Inspect configured temporary directory
  ansible.builtin.stat:
    path: "{{ proxyglass_temp_dir }}"
  register: proxyglass_temp_dir_stat
  become: true

- name: Create configured temporary directory when missing
  ansible.builtin.file:
    path: "{{ proxyglass_temp_dir }}"
    state: directory
    mode: '0755'
  become: true
  when: not proxyglass_temp_dir_stat.stat.exists

- name: Inspect filesystem mounted at the temporary directory
  ansible.builtin.command:
    argv:
      - findmnt
      - --target
      - "{{ proxyglass_temp_dir }}"
      - --noheadings
      - --output
      - TARGET,OPTIONS
  register: proxyglass_temp_mount_result
  changed_when: false
  check_mode: false

- name: Verify temporary directory mount was found
  ansible.builtin.assert:
    that:
      - proxyglass_temp_mount_result.rc == 0
      - proxyglass_temp_mount_result.stdout | length > 0
    fail_msg: "Could not determine mount options for {{ proxyglass_temp_dir }} using findmnt."
    quiet: true

- name: Parse temporary directory mount options
  ansible.builtin.set_fact:
    proxyglass_temp_mount_options: "{{ proxyglass_temp_mount_result.stdout.split()[-1].split(',') }}"

- name: Select temporary directory fallback for a noexec mount
  ansible.builtin.set_fact:
    proxyglass_temp_dir_effective: "{{ proxyglass_allow_noexec_fallback_dir }}"
  when:
    - proxyglass_force_noexec_check | bool
    - "'noexec' in proxyglass_temp_mount_options"
    - proxyglass_allow_noexec_fallback_dir | length > 0

- name: Use configured temporary directory when it permits execution
  ansible.builtin.set_fact:
    proxyglass_temp_dir_effective: "{{ proxyglass_temp_dir }}"
  when:
    - "'noexec' not in proxyglass_temp_mount_options or not (proxyglass_force_noexec_check | bool)"

- name: Inspect effective temporary directory
  ansible.builtin.stat:
    path: "{{ proxyglass_temp_dir_effective }}"
  register: proxyglass_effective_temp_dir_stat
  become: true
  when: proxyglass_temp_dir_effective is defined

- name: Create effective temporary directory when missing
  ansible.builtin.file:
    path: "{{ proxyglass_temp_dir_effective }}"
    state: directory
    mode: '0755'
  become: true
  when:
    - proxyglass_temp_dir_effective is defined
    - not proxyglass_effective_temp_dir_stat.stat.exists

- name: Check fallback filesystem mount options
  ansible.builtin.command:
    argv:
      - findmnt
      - --target
      - "{{ proxyglass_temp_dir_effective }}"
      - --noheadings
      - --output
      - OPTIONS
  register: proxyglass_fallback_mount_result
  changed_when: false
  check_mode: false
  when: proxyglass_temp_dir_effective is defined

- name: Reject a noexec temporary directory
  ansible.builtin.assert:
    that:
      - "'noexec' not in proxyglass_temp_mount_options or not (proxyglass_force_noexec_check | bool)"
    fail_msg: >-
      The filesystem containing {{ proxyglass_temp_dir }} is mounted noexec.
      Configure proxyglass_temp_dir to an executable mount or set
      proxyglass_allow_noexec_fallback_dir to an executable location.
    quiet: true
  when: proxyglass_temp_dir_effective is not defined

- name: Reject a noexec fallback directory
  ansible.builtin.assert:
    that:
      - proxyglass_fallback_mount_result.rc == 0
      - "'noexec' not in proxyglass_fallback_mount_result.stdout.split(',')"
    fail_msg: >-
      The filesystem containing fallback directory {{ proxyglass_temp_dir_effective }}
      is noexec or could not be inspected.
    quiet: true
  when:
    - proxyglass_force_noexec_check | bool
    - proxyglass_temp_dir_effective is defined
    - proxyglass_temp_dir_effective != proxyglass_temp_dir
