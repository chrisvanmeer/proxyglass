---
# Version: 'latest' fetches the newest GitHub release. Set to a tag like 'v0.1.6' to pin.
proxyglass_version: "latest"

# GitHub
proxyglass_github_repo: "chrisvanmeer/proxyglass"
proxyglass_github_api_base: "https://api.github.com"
proxyglass_user_agent: "ansible-collection-chrisvanmeer-proxyglass"
proxyglass_download_timeout: 60
proxyglass_validate_certs: true
proxyglass_http_proxy: "{{ lookup('env', 'HTTP_PROXY', default=lookup('env', 'http_proxy', default='')) }}"
proxyglass_https_proxy: "{{ lookup('env', 'HTTPS_PROXY', default=lookup('env', 'https_proxy', default='')) }}"
proxyglass_no_proxy: "{{ lookup('env', 'NO_PROXY', default=lookup('env', 'no_proxy', default='')) }}"

# Paths
proxyglass_temp_dir: "/tmp"
proxyglass_install_path: "/usr/local/bin/proxyglass"
proxyglass_config_dir: "/etc/proxyglass"
proxyglass_config_path: "{{ proxyglass_config_dir }}/config.yml"
proxyglass_tokens_path: "/var/lib/proxyglass/tokens.json"
proxyglass_data_dir: "/var/lib/proxyglass"
proxyglass_log_dir: "/var/log/proxyglass"
proxyglass_log_file: "{{ proxyglass_log_dir }}/proxyglass.log"
proxyglass_logrotate_path: "/etc/logrotate.d/proxyglass"
proxyglass_listen: "127.0.0.1:8080"
proxyglass_default_refresh: 5

# Service management
proxyglass_service_name: "proxyglass"
proxyglass_service_enabled: true
proxyglass_manage_service: true
proxyglass_service_user: "proxyglass"
proxyglass_service_group: "proxyglass"

# Mount check for temp location
proxyglass_force_noexec_check: true
proxyglass_allow_noexec_fallback_dir: ""

# Token generation (idempotent - never regenerate if token file exists)
proxyglass_generate_token_if_missing: true
proxyglass_token_dir: "{{ proxyglass_config_dir }}"
proxyglass_token_file: "{{ proxyglass_token_dir }}/.proxyglass_auth_token"
proxyglass_token_generate_quiet: true
