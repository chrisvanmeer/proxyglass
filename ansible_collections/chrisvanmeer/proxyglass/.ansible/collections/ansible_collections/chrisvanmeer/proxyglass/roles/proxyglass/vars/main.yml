---
proxyglass_arch_map:
  x86_64: "amd64"
  amd64: "amd64"
  aarch64: "arm64"
  arm64: "arm64"

proxyglass_arch: "{{ proxyglass_arch_map[ansible_facts.architecture] | default('') }}"
proxyglass_asset_name: "proxyglass-linux-{{ proxyglass_arch }}"

proxyglass_download_url_latest: "{{ proxyglass_github_api_base }}/repos/{{ proxyglass_github_repo }}/releases/latest"
proxyglass_download_url_tag: "{{ proxyglass_github_api_base }}/repos/{{ proxyglass_github_repo }}/releases/tags/{{ proxyglass_resolved_version }}"
proxyglass_binary_url: "https://github.com/{{ proxyglass_github_repo }}/releases/download/{{ proxyglass_resolved_version }}/{{ proxyglass_asset_name }}"
