---
- name: Inspect downloaded Proxyglass binary
  ansible.builtin.stat:
    path: "{{ proxyglass_download_dest }}"
    checksum_algorithm: sha256
  register: proxyglass_download_stat
  become: true

- name: Inspect installed Proxyglass binary
  ansible.builtin.stat:
    path: "{{ proxyglass_install_path }}"
    checksum_algorithm: sha256
  register: proxyglass_installed_stat
  become: true

- name: Check whether default config is missing
  ansible.builtin.stat:
    path: "{{ proxyglass_config_path }}"
  register: proxyglass_current_config_stat
  become: true

- name: Predict whether Proxyglass systemd unit needs an update
  ansible.builtin.template:
    src: proxyglass.service.j2
    dest: "/etc/systemd/system/{{ proxyglass_service_name }}.service"
    owner: root
    group: root
    mode: '0644'
  register: proxyglass_unit_check
  check_mode: true
  become: true
  when: proxyglass_manage_service | bool

- name: Set whether Proxyglass needs an installation update
  ansible.builtin.set_fact:
    proxyglass_deploy_required: >-
      {{ (not proxyglass_installed_stat.stat.exists)
         or (proxyglass_download_stat.stat.checksum != proxyglass_installed_stat.stat.checksum)
         or (not proxyglass_current_config_stat.stat.exists)
         or (proxyglass_manage_service | bool and proxyglass_unit_check.changed | default(false)) }}
