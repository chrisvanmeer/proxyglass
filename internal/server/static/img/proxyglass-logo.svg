<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 112" role="img" aria-labelledby="title desc">
  <title id="title">Proxyglass</title>
  <desc id="desc">Proxyglass network dashboard logo: a glowing glass lens over connected proxy nodes.</desc>
  <defs>
    <linearGradient id="pg-gradient" x1="8" y1="6" x2="96" y2="100" gradientUnits="userSpaceOnUse">
      <stop stop-color="#67e8f9"/>
      <stop offset=".52" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="pg-word" x1="132" y1="28" x2="386" y2="93" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e2faff"/>
      <stop offset=".52" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#c4b5fd"/>
    </linearGradient>
    <filter id="pg-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <g transform="translate(4 4)">
    <rect width="104" height="104" rx="30" fill="#0b1426" stroke="#ffffff" stroke-opacity=".12" stroke-width="2"/>
    <circle cx="52" cy="52" r="34" fill="url(#pg-gradient)" fill-opacity=".12" stroke="url(#pg-gradient)" stroke-width="3"/>
    <circle cx="52" cy="52" r="24" fill="#0c172b" stroke="#dffaff" stroke-opacity=".82" stroke-width="2.5"/>
    <path d="M36 52h9l5-10 7 20 5-10h8" fill="none" stroke="url(#pg-gradient)" stroke-linecap="round" stroke-linejoin="round" stroke-width="3.5" filter="url(#pg-glow)"/>
    <circle cx="30" cy="30" r="4" fill="#67e8f9"/>
    <circle cx="75" cy="32" r="4" fill="#a78bfa"/>
    <circle cx="76" cy="74" r="4" fill="#67e8f9"/>
    <path d="m33 33 6 6m34-4-5 6m6 27-6-6" stroke="#dffaff" stroke-opacity=".55" stroke-width="1.5"/>
    <path d="m70 70 17 17" stroke="url(#pg-gradient)" stroke-linecap="round" stroke-width="7"/>
    <path d="m70 70 17 17" stroke="#e0fbff" stroke-linecap="round" stroke-opacity=".8" stroke-width="2"/>
  </g>
  <text x="132" y="75" fill="url(#pg-word)" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="54" font-weight="700" letter-spacing="-2">proxyglass</text>
  <circle cx="433" cy="70" r="5" fill="#34d399"/>
  <circle cx="433" cy="70" r="10" fill="#34d399" fill-opacity=".12"/>
</svg>
