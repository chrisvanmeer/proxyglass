server:
  listen: ":8080"
  default_refresh: 5

require_auth: true
tokens_file: "/tmp/proxyglass-tokens.json"
log_path: ""

targets:
  - name: edge-01
    url: http://haproxy1:8404/stats;csv
    username: admin
    password: changeme
  - name: edge-02
    url: http://haproxy2:8404/stats;csv
    username: admin
    password: changeme
  - name: edge-03
    url: http://haproxy3:8404/stats;csv
    username: admin
    password: changeme

# Visual-only links for the dashboard topology overview.
topology:
  - target: edge-01
    frontend: http_front
    backends: [web_servers]
  - target: edge-01
    frontend: api_frontend
    backends: [api_backend]
  - target: edge-01
    frontend: tcp_proxy
    backends: [tcp_backend]
  - target: edge-01
    frontend: gateway_frontend
    backends: [web_servers, api_backend, cache_backend, metrics_backend]
  - target: edge-02
    frontend: http_front
    backends: [app_servers]
  - target: edge-02
    frontend: static_frontend
    backends: [static_backend]
  - target: edge-03
    frontend: edge_frontend
    backends: [edge_backend]
  - target: edge-03
    frontend: admin_frontend
    backends: [admin_backend]
