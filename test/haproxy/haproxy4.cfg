global
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client  50s
  timeout server  50s

frontend status_frontend
  bind *:80
  default_backend status_backend

backend status_backend
  balance roundrobin
  server status-production-eu-west-1-01 edge4:80 check inter 2s init-addr libc,none
  server status-production-eu-west-1-02 edge4:80 check inter 2s init-addr libc,none

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats auth admin:changeme
  stats show-legends
  stats show-node
