global
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client  50s
  timeout server  50s

frontend edge_frontend
  bind *:80
  default_backend edge_backend

frontend admin_frontend
  bind *:8083
  default_backend admin_backend

backend edge_backend
  balance roundrobin
  server edge-production-eu-west-1-01 edge1:80 check inter 2s init-addr libc,none
  server edge2 edge2:80 check inter 2s init-addr libc,none
  server edge3 edge3:80 check inter 2s init-addr libc,none
  server edge4 edge4:80 check inter 2s init-addr libc,none

backend admin_backend
  balance source
  server admin1 admin1:80 check inter 2s init-addr libc,none
  server admin2 admin2:80 check inter 2s init-addr libc,none

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats auth admin:changeme
  stats show-legends
  stats show-node
