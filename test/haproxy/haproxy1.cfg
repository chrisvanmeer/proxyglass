global
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client  50s
  timeout server  50s
  option httplog

frontend http_front
  bind *:80
  default_backend web_servers

frontend api_frontend
  bind *:8081
  default_backend api_backend

backend web_servers
  balance roundrobin
  option httpchk GET /
  server web-production-eu-west-1-01 web1:80 check inter 2s init-addr libc,none
  server web-production-eu-west-1-02 web2:80 check inter 2s init-addr libc,none
  server web3-production-eu-west-1-03 web3:80 check inter 2s init-addr libc,none
  server web-unavailable-production-zone-east-2 127.0.0.1:9 check inter 2s

backend api_backend
  balance leastconn
  option httpchk GET /
  server api-production-eu-west-1-01 api1:80 check inter 2s init-addr libc,none
  server api2 api2:80 check inter 2s init-addr libc,none
  server api3 api3:80 check inter 2s init-addr libc,none

backend cache_backend
  balance roundrobin
  option httpchk GET /
  server cache1 web1:80 check inter 2s init-addr libc,none

backend metrics_backend
  balance roundrobin
  option httpchk GET /
  server metrics1 api1:80 check inter 2s init-addr libc,none

frontend tcp_proxy
  mode tcp
  bind *:8082
  default_backend tcp_backend

backend tcp_backend
  mode tcp
  balance roundrobin
  server tcp1 web1:80 check inter 2s init-addr libc,none

frontend gateway_frontend
  bind *:8083
  default_backend web_servers

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats auth admin:changeme
  stats show-legends
  stats show-node
