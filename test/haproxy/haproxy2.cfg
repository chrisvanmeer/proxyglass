global
  log stdout format raw local0

defaults
  mode http
  timeout connect 5s
  timeout client  50s
  timeout server  50s

frontend http_front
  bind *:80
  default_backend app_servers

frontend static_frontend
  bind *:8082
  default_backend static_backend

backend app_servers
  balance roundrobin
  server app-production-eu-west-1-01 app1:80 check inter 2s init-addr libc,none
  server app-production-eu-west-1-02 app2:80 check inter 2s init-addr libc,none
  server app3 app3:80 check inter 2s init-addr libc,none
  server app4 app4:80 check inter 2s init-addr libc,none

backend static_backend
  balance roundrobin
  server static1 static1:80 check inter 2s init-addr libc,none
  server static2 static2:80 check inter 2s init-addr libc,none

listen stats
  bind *:8404
  stats enable
  stats uri /stats
  stats refresh 5s
  stats auth admin:changeme
  stats show-legends
  stats show-node
