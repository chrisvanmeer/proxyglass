name: proxyglass
arch: ${GOARCH}
platform: linux
version: ${VERSION}
section: net
priority: optional
maintainer: Chris van Meer
vendor: Proxyglass
homepage: https://github.com/chrisvanmeer/proxyglass
license: MIT
description: >-
  A sleek read-only dashboard for HAProxy stats.
  The package installs and manages the Proxyglass systemd service.
depends:
  - systemd
contents:
  - src: ${BINARY}
    dst: /usr/bin/proxyglass
    expand: true
    file_info:
      mode: 0755
  - src: packaging/proxyglass.service
    dst: /usr/lib/systemd/system/proxyglass.service
    file_info:
      mode: 0644
  - src: packaging/default-config.yml
    dst: /etc/proxyglass/config.yml
    type: config|noreplace
    file_info:
      mode: 0640
      owner: root
      group: proxyglass
  - src: packaging/default-environment
    dst: /etc/default/proxyglass
    type: config|noreplace
    file_info:
      mode: 0644
  - dst: /etc/proxyglass
    type: dir
    file_info:
      mode: 0750
      owner: root
      group: proxyglass
  - dst: /var/lib/proxyglass
    type: dir
    file_info:
      mode: 0750
      owner: proxyglass
      group: proxyglass
  - dst: /var/log/proxyglass
    type: dir
    file_info:
      mode: 0750
      owner: proxyglass
      group: proxyglass
scripts:
  preinstall: packaging/preinstall.sh
  postinstall: packaging/postinstall.sh
overrides:
  deb:
    scripts:
      preremove: packaging/deb-preremove.sh
      postremove: packaging/deb-postremove.sh
  rpm:
    scripts:
      preremove: packaging/rpm-preremove.sh
      postremove: packaging/rpm-postremove.sh
rpm:
  requires:
    post:
      - systemd
