---
name: Ansible Collection Tests

on:
  push:
    paths:
      - 'ansible_collections/**'
      - '.github/workflows/ansible-tests.yml'
      - '.github/workflows/publish-galaxy.yml'
  pull_request:
    paths:
      - 'ansible_collections/**'
      - '.github/workflows/ansible-tests.yml'
      - '.github/workflows/publish-galaxy.yml'

jobs:
  molecule:
    name: Molecule test (install role)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint molecule 'molecule-plugins[docker]' docker requests
          ansible-galaxy collection install community.docker ansible.posix

      - name: Run ansible-lint on collection
        run: |
          cd ansible_collections/chrisvanmeer/proxyglass
          ansible-lint
          yamllint .

      - name: Run Molecule test
        run: |
          cd ansible_collections/chrisvanmeer/proxyglass/roles/proxyglass
          molecule test
        env:
          ANSIBLE_FORCE_COLOR: '1'
          ANSIBLE_COLLECTIONS_PATH: ${{ github.workspace }}
          PY_COLORS: '1'
