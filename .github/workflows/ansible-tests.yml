---
name: Ansible Collection Tests

on:
  push:
    paths:
      - 'ansible_collections/**'
      - '.github/workflows/ansible-tests.yml'
      - '.github/workflows/publish-galaxy.yml'
  pull_request:
    paths:
      - 'ansible_collections/**'
      - '.github/workflows/ansible-tests.yml'
      - '.github/workflows/publish-galaxy.yml'

jobs:
  molecule:
    name: Molecule test (install role)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ansible-core ansible-lint yamllint molecule 'molecule-plugins[docker]' docker requests
          ansible-galaxy collection install community.docker ansible.posix --force --ignore-errors
          pip install 'docker>=7.0.0'

      - name: Run ansible-lint on collection
        run: |
          cd ansible_collections/chrisvanmeer/proxyglass
          ansible-lint
          yamllint .

      - name: Wait for release assets
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in $(seq 1 60); do
            if gh release view "$GITHUB_REF_NAME" --json assets -q '.assets[].name' | grep -qx 'proxyglass-linux-amd64'; then
              echo "Release asset proxyglass-linux-amd64 is available for $GITHUB_REF_NAME"
              exit 0
            fi
            echo "Waiting for release asset proxyglass-linux-amd64 ($attempt/60)..."
            sleep 10
          done
          echo "Timed out waiting for release asset proxyglass-linux-amd64" >&2
          exit 1

      - name: Run Molecule test
        run: |
          cd ansible_collections/chrisvanmeer/proxyglass/roles/proxyglass
          molecule test
        env:
          ANSIBLE_FORCE_COLOR: '1'
          PY_COLORS: '1'
