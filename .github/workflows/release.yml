---
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build Multi-Platform Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'

      - name: Cross-compile Binaries
        run: |
          mkdir -p dist
          VERSION=${GITHUB_REF_NAME}
          LDFLAGS="-w -s -X github.com/chrisvanmeer/proxyglass/internal/build.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/proxyglass-linux-amd64 ./cmd/proxyglass
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="${LDFLAGS}" -o dist/proxyglass-linux-arm64 ./cmd/proxyglass

      - name: Install nfpm
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.48.0
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build DEB and RPM packages
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          export VERSION="${RELEASE_VERSION#v}"
          for GOARCH in amd64 arm64; do
            export GOARCH
            export BINARY="dist/proxyglass-linux-${GOARCH}"
            nfpm package --config packaging/nfpm.yaml --packager deb --target dist
            nfpm package --config packaging/nfpm.yaml --packager rpm --target dist
          done

      - name: Generate SBOMs
        uses: anchore/sbom-action@v0
        with:
          path: ./dist
          format: cyclonedx-json
          output-file: ./dist/sbom.cdx.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Proxyglass Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite_files: true
          generate_release_notes: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
